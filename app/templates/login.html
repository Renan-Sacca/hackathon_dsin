{% extends "base.html" %}

{% block title %}Acesso ao Sistema — PROMETHEUS F.O.G.O.{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="glass-panel p-4 p-md-5" style="max-width: 460px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-info bg-opacity-10 border border-info border-opacity-25 mb-3 shadow-lg">
                <i class="bi bi-shield-shaded text-info fs-1"></i>
            </div>
            <h2 class="fw-bold brand-title fs-3 mb-1">PROMETHEUS</h2>
            <p class="text-secondary small mb-0">F.O.G.O. — Fiscalização, Operação, Gestão e Ocorrências</p>
        </div>

        <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope text-info me-1"></i> E-mail de Acesso
                </label>
                <input type="email" class="form-control" id="email" required placeholder="admin@prometheus.gov" autofocus>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">
                    <i class="bi bi-lock text-info me-1"></i> Senha
                </label>
                <input type="password" class="form-control" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-cyan w-100 py-2 justify-content-center mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema
            </button>

            <!-- One-Click Demo Admin Button -->
            <button type="button" id="btn-fill-admin" class="btn btn-outline-glass w-100 py-2 justify-content-center small text-info">
                <i class="bi bi-key-fill text-warning"></i> Usar Credenciais do Administrador Padrão
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center text-muted small">
            <i class="bi bi-shield-lock me-1"></i> Acesso Restrito a Operadores Autorizados
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const btnSubmit = document.getElementById('btn-submit');
    const btnFillAdmin = document.getElementById('btn-fill-admin');

    // Fill Admin credentials for quick testing
    btnFillAdmin.addEventListener('click', () => {
        document.getElementById('email').value = 'admin@prometheus.gov';
        document.getElementById('senha').value = 'admin123';
        showToast('Credenciais do Administrador Padrão preenchidas.', 'info');
    });

    // Check if session expired
    if (new URLSearchParams(window.location.search).get('expired')) {
        showToast('Sua sessão expirou. Faça login novamente.', 'warning');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Autenticando...';

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;

        try {
            const data = await apiFetch('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, senha })
            });

            if (data && data.access_token) {
                setToken(data.access_token);
                showToast(`Bem-vindo, ${data.user.nome}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/admin/equipamentos';
                }, 400);
            }
        } catch (err) {
            alertBox.textContent = err.message || 'Falha ao autenticar. Verifique seus dados.';
            alertBox.classList.remove('d-none');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema';
        }
    });
</script>
{% endblock %}
